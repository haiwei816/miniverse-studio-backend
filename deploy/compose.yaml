name: miniverse-mvp
x-logging: &bounded_logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  mysql:
    image: mysql:8.4
    logging: *bounded_logs
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: miniverse
      MYSQL_USER: miniverse
      MYSQL_PASSWORD: local-development-only
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
  migrate:
    image: miniverse-api:local
    logging: *bounded_logs
    build: {context: .., dockerfile: deploy/Dockerfile}
    entrypoint: [/app/migrate]
    environment: &api_env
      MYSQL_DSN: miniverse:local-development-only@tcp(mysql:3306)/miniverse?parseTime=true
      HTTP_HOST: 0.0.0.0
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_ENV: sandbox
      RULECORE_ADDR: rulecore:50051
      COMPANION_CHAT_URL: ${COMPANION_CHAT_URL:-}
      COMPANION_API_KEY: ${COMPANION_API_KEY:-}
      COMPANION_MODEL: ${COMPANION_MODEL:-}
      OPS_AGENT_PROTOCOL: ${OPS_AGENT_PROTOCOL:-}
      OPS_AGENT_URL: ${OPS_AGENT_URL:-}
      OPS_AGENT_API_KEY: ${OPS_AGENT_API_KEY:-}
      OPS_AGENT_MODEL: ${OPS_AGENT_MODEL:-}
      OPS_AGENT_SECRET_KEY: ${OPS_AGENT_SECRET_KEY:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-sandbox-metrics-scrape-token}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
    depends_on:
      mysql: {condition: service_healthy}
  redis:
    image: redis:7.4-alpine
    logging: *bounded_logs
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    logging: *bounded_logs
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=256M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: miniverse-api:local
    logging: *bounded_logs
    stop_grace_period: 15s
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment: *api_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-18080}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
  rulecore:
    image: miniverse-rulecore:local
    logging: *bounded_logs
    profiles: [rules]
    build: {context: .., dockerfile: rulecore/Dockerfile}
    expose: ["50051"]
  gm:
    logging: *bounded_logs
    profiles: [gm]
    build: {context: .., dockerfile: admin/web/Dockerfile}
    ports: ["127.0.0.1:${GM_PORT:-18081}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 3s
      retries: 6
  player:
    logging: *bounded_logs
    profiles: [player]
    build: {context: .., dockerfile: player/web/Dockerfile}
    ports: ["127.0.0.1:${PLAYER_PORT:-18082}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 3s
      retries: 6
  prometheus:
    image: prom/prometheus:v2.54.1
    logging: *bounded_logs
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"]
    depends_on:
      api: {condition: service_healthy}
  grafana:
    image: grafana/grafana:11.2.2
    logging: *bounded_logs
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sandbox-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-13000}:3000"]
    depends_on:
      - prometheus
volumes:
  mysql_data:
