apiVersion: v1
kind: Namespace
metadata:
  name: miniverse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: miniverse-config
  namespace: miniverse
data:
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
  APP_ENV: "production"
  RULECORE_ADDR: "miniverse-rulecore:50051"
  REDIS_ADDR: "miniverse-redis:6379"
  KAFKA_BROKERS: "miniverse-redpanda:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniverse-api
  namespace: miniverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miniverse-api
  template:
    metadata:
      labels:
        app: miniverse-api
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: miniverse-api:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: miniverse-config
          env:
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: miniverse-secrets
                  key: mysql_dsn
            - name: OPS_AGENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: miniverse-secrets
                  key: ops_agent_secret_key
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: miniverse-api
  namespace: miniverse
spec:
  selector:
    app: miniverse-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: miniverse-api-hpa
  namespace: miniverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: miniverse-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniverse-rulecore
  namespace: miniverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miniverse-rulecore
  template:
    metadata:
      labels:
        app: miniverse-rulecore
    spec:
      containers:
        - name: rulecore
          image: miniverse-rulecore:local
          ports:
            - containerPort: 50051
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: miniverse-rulecore
  namespace: miniverse
spec:
  selector:
    app: miniverse-rulecore
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
