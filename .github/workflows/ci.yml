name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: cd backend && go test -race ./... && go vet ./... && go build ./...
      - run: cd admin/web && npm ci && npm audit --audit-level=high && npm run build
      - run: docker compose -f deploy/compose.yaml --profile rules --profile gm up -d --build
      - run: node tests/e2e.mjs
      - run: node tests/mail-inventory.mjs
      - run: node tests/mail-inventory-upgrade.mjs
      - run: node tests/migrations.mjs && node tests/production-boundary.mjs
      - run: node tests/recovery.mjs
      - run: |
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path sdk/godot --editor --import --quit
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path sdk/godot --script test_sdk.gd
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path sdk/godot --script test_saves.gd
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path sdk/godot --script test_local_bridge.gd
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path sdk/godot --script test_mail_inventory.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verification, path: docs/verification/}
