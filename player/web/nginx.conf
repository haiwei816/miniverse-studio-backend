server {
  listen 8080;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8080;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  location /v1/ {
    proxy_pass $api;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /health { proxy_pass $api; }
  location /ready { proxy_pass $api; }
  # The sandboxed game's opaque origin can fetch only these public VM bytes.
  # No API response or credentials are exposed by this static CORS location.
  location /games/witch-cauldron/runtime/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /games/ { add_header Cache-Control "no-store" always; try_files $uri $uri/ =404; }
  location / { try_files $uri $uri/ /index.html; }
}
