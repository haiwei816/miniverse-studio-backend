<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天空岛物语 · MiniVerse</title><link rel="stylesheet" href="/games/common.css"></head><body><main class="game-layout"><header class="game-top"><div><div class="eyebrow">MINIVERSE ORIGINAL · PLAYABLE DEMO</div><h1>天空岛物语</h1><p class="sub">收集木材，建起属于你的云端小村。</p></div><div class="status" id="status" role="status">正在连接平台…</div></header><div class="game-columns"><section class="panel"><div class="hud"><div><small>你的岛屿资源</small><div class="resource">木材 <span id="wood">0</span></div></div><button id="gather" disabled>收集木材 +4</button></div><div class="island-stage"><div class="floating-island"><div class="village" id="village">🌲</div></div></div><div class="buildings" id="buildings"></div><div class="completion" id="completion" aria-live="polite"></div><div class="save-tools"><button class="secondary" id="save" disabled>保存进度</button><button class="secondary" id="reload" disabled>读取云端</button></div><p class="notice">示例中的木材和建筑属于本游戏存档。它们不会转换成平台资产；云端冲突时会保留当前界面，不自动覆盖。</p></section><aside class="sidebar-panels"><section class="panel"><div class="eyebrow">A SMALL GOAL</div><h2>让三座建筑亮起来</h2><p>先收集木材，再升级小屋、风车和灯塔。每座建筑最多三级。小岛会随着你的建设慢慢热闹起来。</p><span class="badge" id="progress">0 / 9 次升级</span></section><section class="panel"><div class="eyebrow">COMPANION BY YOUR SIDE</div><h2>伙伴提示</h2><p class="hint-text" id="hint-text">需要一点方向时，叫上你的伙伴。</p><button class="secondary wide" id="hint" disabled>给我一个小提示 ✦</button></section></aside></div></main><script src="/games/bridge.js"></script><script src="/games/sky-island/game.js"></script></body></html>
