<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星际卡牌 · MiniVerse</title><link rel="stylesheet" href="/games/common.css"></head><body class="card-mode"><main class="game-layout"><header class="game-top"><div><div class="eyebrow">MINIVERSE ORIGINAL · PLAYABLE DEMO</div><h1>星际卡牌</h1><p class="sub">翻开星空里的小秘密，找到所有相同的图案。</p></div><div class="status" id="status" role="status">正在连接平台…</div></header><div class="game-columns"><section class="panel"><div class="hud"><div><small>这次挑战</small><div class="resource"><span id="matched">0</span> / 6 对</div></div><small>翻牌 <strong id="moves">0</strong> 次</small></div><div class="card-board" id="board"></div><div class="completion" id="completion" aria-live="polite"></div><div class="card-actions"><p>累计完成 <strong id="wins">0</strong> 次挑战</p><button id="new-round" disabled>开始新一局 ↻</button></div><div class="save-tools"><button class="secondary" id="save" disabled>保存进度</button><button class="secondary" id="reload" disabled>读取云端</button></div><p class="notice">匹配进度会保存到账号的本游戏存档。伙伴只提供文字建议，不会自动替你翻牌或修改成绩。</p></section><aside class="sidebar-panels"><section class="panel"><div class="eyebrow">A LITTLE MEMORY</div><h2>给好奇心一点耐心</h2><p>每次翻开两张卡片。图案相同即可保留，不同则重新盖上。找到全部六对图案，完成本次挑战。</p><span class="badge">轻策略 · 记忆配对</span></section><section class="panel"><div class="eyebrow">COMPANION BY YOUR SIDE</div><h2>伙伴提示</h2><p class="hint-text" id="hint-text">别急，我们可以慢慢记住它们的位置。</p><button class="secondary wide" id="hint" disabled>听听伙伴的建议 ✦</button></section></aside></div></main><script src="/games/bridge.js"></script><script src="/games/card-game/game.js"></script></body></html>
